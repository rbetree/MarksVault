name: Create Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (format: v1.5.2)'
        required: true
        default: 'v1.5.2'

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Verify Manual Release Branch
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        run: |
          echo "::error::Manual releases must run from main (current: $GITHUB_REF)"
          exit 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Get Version
        id: get_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_ENV
          else
            echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
          fi

      - name: Get Package Version
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          echo "PACKAGE_VERSION=$PACKAGE_VERSION" >> "$GITHUB_ENV"

      - name: Verify Version
        run: |
          TAG_VERSION="${{ env.VERSION }}"
          TAG_VERSION_NO_V="${TAG_VERSION#v}"

          echo "Package.json version: ${{ env.PACKAGE_VERSION }}"
          echo "Release version: ${{ env.VERSION }}"
          if [ "$TAG_VERSION_NO_V" != "${{ env.PACKAGE_VERSION }}" ]; then
            echo "::error::Release version ${{ env.VERSION }} does not match package.json ${{ env.PACKAGE_VERSION }}"
            exit 1
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit Tests
        run: npm test

      - name: Build & Zip Extensions
        run: npm run zip:all

      - name: Generate Changelog
        id: changelog
        run: |
          if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            # Tag 触发时 HEAD 就是当前 tag，必须从父提交开始找上一个 tag，否则日志范围为空
            RELEASE_REF="${{ env.VERSION }}"
            PREVIOUS_TAG=$(git describe --tags --abbrev=0 "${RELEASE_REF}^" 2>/dev/null || echo "")

            if [ -z "$PREVIOUS_TAG" ]; then
              CHANGELOG=$(git log --pretty=format:"* %s (%h)" "$RELEASE_REF")
              echo "CHANGELOG_TITLE=All Changes" >> "$GITHUB_ENV"
            else
              CHANGELOG=$(git log --pretty=format:"* %s (%h)" "$PREVIOUS_TAG..$RELEASE_REF")
              echo "CHANGELOG_TITLE=Changes Since $PREVIOUS_TAG" >> "$GITHUB_ENV"
            fi
          else
            PREVIOUS_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")

            if [ -z "$PREVIOUS_TAG" ]; then
              CHANGELOG=$(git log --pretty=format:"* %s (%h)" -n 10)
              echo "CHANGELOG_TITLE=Recent Changes (Last 10 Commits)" >> "$GITHUB_ENV"
            else
              CHANGELOG=$(git log --pretty=format:"* %s (%h)" -n 10 "$PREVIOUS_TAG..HEAD")
              echo "CHANGELOG_TITLE=Recent Changes Since $PREVIOUS_TAG (Last 10 Commits)" >> "$GITHUB_ENV"
            fi
          fi
          
          # Use delimiter to properly handle multiline output
          {
            echo "CHANGELOG<<EOF"
            echo "$CHANGELOG"
            echo "EOF"
          } >> $GITHUB_ENV
          
          # Generate release date with UTC timezone
          echo "RELEASE_DATE=$(date +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_ENV

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.VERSION }}
          name: ${{ env.VERSION }}
          body: |
            **Release Date**: ${{ env.RELEASE_DATE }}
            
            ## ${{ env.CHANGELOG_TITLE }}
            
            ${{ env.CHANGELOG }}
            
            ---
            
            ## 📦 Installation | 安装
            
            Please refer to the [Installation Guide](https://github.com/rbetree/MarksVault#-安装指南) for detailed installation steps.
            
            请参阅[安装指南](https://github.com/rbetree/MarksVault#-安装指南) 获取详细的安装步骤。

          draft: false
          prerelease: false
          files: |
            .output/marksvault-${{ env.PACKAGE_VERSION }}-chrome.zip
            .output/marksvault-${{ env.PACKAGE_VERSION }}-edge.zip
            .output/marksvault-${{ env.PACKAGE_VERSION }}-firefox.zip
            .output/marksvault-${{ env.PACKAGE_VERSION }}-sources.zip
